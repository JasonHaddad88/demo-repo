name: VortexView for Android

on:
  push:
    paths:
      - "vortexview-android/**"
      - ".github/workflows/vortexview-android.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vortexview-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: vortexview-android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Test moving, undo and the zoom arithmetic
        run: ./gradlew :core:test --no-daemon --stacktrace

      - name: Let the emulator use hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Use the app on an Android emulator (swipe, move, undo, zoom)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          working-directory: vortexview-android
          script: ./gradlew :app:connectedDebugAndroidTest --no-daemon --stacktrace

      - name: Publish the emulator's screenshots
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p screens
          find app/build/outputs -name 'vortexview-*.png' -exec cp {} screens/ \;
          ls -l screens
          if ls screens/*.png >/dev/null 2>&1; then
            TAG=vortexview-android-screens
            gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag 2>/dev/null || true
            gh release create "$TAG" screens/*.png \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --prerelease \
              --title "VortexView for Android: what the emulator saw" \
              --notes "Screenshots from the on-device test of build ${GITHUB_RUN_NUMBER} (${GITHUB_SHA::7}). Test photos only."
          fi

      - name: Build the APK
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Name the APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/VortexView-${GITHUB_RUN_NUMBER}.apk"
          cp app/build/outputs/apk/release/app-release.apk dist/VortexView.apk
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: VortexView-Android-${{ github.run_number }}
          path: vortexview-android/dist/VortexView-*.apk
          if-no-files-found: error

      - name: Publish as the "vortexview-android-latest" pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=vortexview-android-latest
          NOTES="VortexView for Android, build ${GITHUB_RUN_NUMBER}, from ${GITHUB_REF_NAME} at ${GITHUB_SHA::7}.

          On your phone: download VortexView.apk below, open it, and allow installing from this source when Android asks. Newer builds install over older ones and keep your folders and settings."
          # Recreate it each time so the tag always points at the build's commit.
          gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" dist/VortexView.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "VortexView for Android (latest build)" \
            --notes "$NOTES"
